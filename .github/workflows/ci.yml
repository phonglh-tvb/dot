name: ci

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Chỉ dùng actions/checkout chính chủ (ghim theo mã commit); công cụ cài bằng Homebrew như trên máy thật.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks quét cả lịch sử
          persist-credentials: false

      - name: Cài công cụ
        run: |
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          brew install shellcheck shfmt stylua actionlint gitleaks hadolint
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"

      - name: shellcheck
        run: shellcheck install.sh scripts/*.sh .githooks/pre-commit .githooks/pre-push docker/pkg-scanner/entrypoint.sh

      - name: shfmt
        run: shfmt -d -i 2 -ci install.sh scripts/*.sh .githooks/pre-commit .githooks/pre-push docker/pkg-scanner/entrypoint.sh

      - name: stylua
        run: stylua --check config/nvim

      - name: actionlint
        run: actionlint

      - name: hadolint
        run: hadolint docker/pkg-scanner/Dockerfile

      - name: gitleaks (file và lịch sử)
        run: |
          gitleaks dir --redact --no-banner --config .gitleaks.toml .
          gitleaks git --redact --no-banner --config .gitleaks.toml .

  # Dựng cấu hình trong HOME giả và kiểm tra các nhánh theo hệ điều hành
  config:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cài shell và tmux
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq fish zsh tmux xclip
          else
            brew install fish tmux
          fi

      - name: Cú pháp script (bash 3.2 trên macOS)
        run: |
          for f in install.sh scripts/*.sh .githooks/pre-commit .githooks/pre-push; do
            /bin/bash -n "$f"
          done

      - name: Cú pháp zsh và fish
        run: |
          zsh -n config/.zshenv config/.zprofile config/.zshrc
          fish -n config/fish/config.fish config/fish/conf.d/*.fish

      - name: link.sh chạy hai lần trong HOME giả
        run: |
          HOME="$(mktemp -d)"
          export HOME
          unset XDG_CONFIG_HOME
          scripts/link.sh apply
          scripts/link.sh apply | tee "$RUNNER_TEMP/second.txt"
          grep -q 'changed=0' "$RUNNER_TEMP/second.txt"
          # status không được còn đề nghị link / backup nào (nghĩa là mọi link đã đúng)
          ! scripts/link.sh status | grep -E '^\s+(link|backup)\s'

      - name: link.sh giữ file lạ trong thư mục .link-each và gỡ link mồ côi
        run: |
          HOME="$(mktemp -d)"
          export HOME
          unset XDG_CONFIG_HOME
          mkdir -p "$HOME/.config/gh"
          echo login >"$HOME/.config/gh/hosts.yml"
          ln -s "$PWD/config/da-xoa" "$HOME/.config/da-xoa"
          scripts/link.sh apply | tee "$RUNNER_TEMP/third.txt"
          grep -q 'stale' "$RUNNER_TEMP/third.txt"
          [ ! -L "$HOME/.config/da-xoa" ]
          [ "$(cat "$HOME/.config/gh/hosts.yml")" = login ]
          [ -L "$HOME/.config/gh/config.yml" ]
          [ ! -L "$HOME/.config/gh" ]

      - name: install.sh liệt kê bước
        run: ./install.sh --list

      - name: tmux chọn đúng lệnh clipboard
        run: |
          export TERM=xterm-256color
          tmux -L ci -f config/tmux/tmux.conf new-session -d -s ci 'sleep 60'
          got="$(tmux -L ci show -sv copy-command)"
          tmux -L ci kill-server
          echo "$got"
          if [ "$RUNNER_OS" = Linux ]; then
            [ "$got" = "xclip -selection clipboard -in" ]
          else
            [ "$got" = "pbcopy" ]
          fi

      - name: Brewfile đúng cú pháp
        if: runner.os == 'macOS'
        run: |
          for f in Brewfile Brewfile.*; do
            brew bundle list --all --file="$f" > /dev/null
          done

  # Cài thật trên Ubuntu: apt, Linuxbrew (lõi + devops), link, hooks, font; rồi đối chiếu với khai báo.
  # mise và nvim (tải vài GB) chưa nằm trong CI.
  install-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HOMEBREW_BUNDLE_NO_UPGRADE: "1"
      HOMEBREW_NO_ANALYTICS: "1"
      HOMEBREW_NO_ENV_HINTS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: apt
        run: ./install.sh apt

      # Runner có sẵn Linuxbrew nhưng chưa nằm trong PATH: đúng tình huống brew_shellenv của install.sh phải xử lý
      - name: brew (lõi và devops)
        run: ./install.sh brew

      - name: PATH cho các bước sau
        run: echo "/home/linuxbrew/.linuxbrew/bin" >> "$GITHUB_PATH"

      - name: Công cụ chạy được
        run: |
          for t in nvim mise fish tmux starship atuin zoxide fzf rg fd bat eza jq gh lazygit gitleaks docker terraform; do
            command -v "$t" || { echo "thiếu $t"; exit 1; }
          done
          nvim --version | head -1
          nvim --headless -c 'lua assert(vim.fn.has("nvim-0.12") == 1, "cần Neovim 0.12+")' -c q

      - name: link, hooks, fonts trong HOME giả
        run: |
          HOME="$(mktemp -d)"
          export HOME
          unset XDG_CONFIG_HOME
          ./install.sh link hooks fonts
          ./install.sh link fonts | tee "$RUNNER_TEMP/second.txt"
          grep -q 'changed=0' "$RUNNER_TEMP/second.txt"
          [ -n "$(find "$HOME/.local/share/fonts/NerdFonts" -name 'JetBrainsMonoNerdFont-Regular.ttf')" ]
          # shell sạch, không có brew trong PATH: conf.d/brew.fish phải tự tìm ra brew, và không được báo lỗi nào
          out="$(env -i HOME="$HOME" PATH=/usr/bin:/bin /home/linuxbrew/.linuxbrew/bin/fish -c 'type -q brew; and type -q atuin; and echo fish-thay-brew' 2>&1)"
          echo "$out"
          [ "$out" = fish-thay-brew ]

      - name: drift.sh trên Linux
        run: |
          scripts/drift.sh | tee "$RUNNER_TEMP/drift.txt" || true
          # gói khai báo thì phải cài được; phần "đã cài mà chưa khai báo" của runner không phải việc của repo
          ! grep -E 'khai báo mà chưa cài' "$RUNNER_TEMP/drift.txt"
