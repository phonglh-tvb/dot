name: ci

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Chỉ dùng actions/checkout chính chủ (ghim theo mã commit); công cụ cài bằng Homebrew như trên máy thật.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks quét cả lịch sử
          persist-credentials: false

      - name: Cài công cụ
        run: |
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          brew install shellcheck shfmt stylua actionlint gitleaks
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"

      - name: shellcheck
        run: shellcheck install.sh scripts/*.sh .githooks/pre-commit .githooks/pre-push docker/pkg-scanner/entrypoint.sh

      - name: shfmt
        run: shfmt -d -i 2 -ci install.sh scripts/*.sh .githooks/pre-commit .githooks/pre-push docker/pkg-scanner/entrypoint.sh

      - name: stylua
        run: stylua --check config/nvim

      - name: actionlint
        run: actionlint

      - name: gitleaks (file và lịch sử)
        run: |
          gitleaks dir --redact --no-banner --config .gitleaks.toml .
          gitleaks git --redact --no-banner --config .gitleaks.toml .

  # Dựng cấu hình trong HOME giả và kiểm tra các nhánh theo hệ điều hành
  config:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cài shell và tmux
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq fish zsh tmux xclip
          else
            brew install fish tmux
          fi

      - name: Cú pháp script (bash 3.2 trên macOS)
        run: |
          for f in install.sh scripts/*.sh .githooks/pre-commit .githooks/pre-push; do
            /bin/bash -n "$f"
          done

      - name: Cú pháp zsh và fish
        run: |
          zsh -n config/.zshenv config/.zprofile config/.zshrc
          fish -n config/fish/config.fish config/fish/conf.d/*.fish

      - name: link.sh chạy hai lần trong HOME giả
        run: |
          HOME="$(mktemp -d)"
          export HOME
          unset XDG_CONFIG_HOME
          scripts/link.sh apply
          scripts/link.sh apply | tee "$RUNNER_TEMP/second.txt"
          grep -q 'changed=0' "$RUNNER_TEMP/second.txt"
          # status không được còn đề nghị link / backup nào (nghĩa là mọi link đã đúng)
          ! scripts/link.sh status | grep -E '^\s+(link|backup)\s'

      - name: install.sh liệt kê bước
        run: ./install.sh --list

      - name: tmux chọn đúng lệnh clipboard
        run: |
          export TERM=xterm-256color
          tmux -L ci -f config/tmux/tmux.conf new-session -d -s ci 'sleep 60'
          got="$(tmux -L ci show -sv copy-command)"
          tmux -L ci kill-server
          echo "$got"
          if [ "$RUNNER_OS" = Linux ]; then
            [ "$got" = "xclip -selection clipboard -in" ]
          else
            [ "$got" = "pbcopy" ]
          fi

      - name: Brewfile đúng cú pháp
        if: runner.os == 'macOS'
        run: |
          for f in Brewfile Brewfile.*; do
            brew bundle list --all --file="$f" > /dev/null
          done
