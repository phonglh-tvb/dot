#================================================================================#
#                                  Plugins                                       #
#================================================================================#

# Install tpm if not exists
if "test ! -d ~/.config/tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.config/tmux/plugins/tpm && ~/.config/tmux/plugins/tpm/bin/install_plugins'"

# Set plugin install path
set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.config/tmux/plugins/'

# Tmux plugin manager
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-urlview'
set -g @plugin 'schasse/tmux-jump'
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'jabirali/tmux-tilish'

#================================================================================#
#                                  Settings                                      #
#================================================================================#

# Change prefix key from C-b to C-f
unbind C-b
set -g prefix C-f
bind C-f send-prefix

# Enable 256 colors in the terminal emulator
set -g default-terminal "screen-256color"
set-option -sa terminal-overrides ",xterm-256color:Tc:RGB:xterm*:smcup@:rmcup@"

# Set first window/ pane to index 1
set -g base-index 1
set -g pane-base-index 1

# Renumber windows when a window is closed
set -g renumber-windows on

# Allow rename window automatically
setw -g automatic-rename on

# Rename window to reflect current folder
set-option -g automatic-rename-format '#{b:pane_current_path}'

# Increase the scrollback history limit to make Tmux panes remember more lines
set -g history-limit 10000

# Monitor window activity. Windows with activity are highlighted in the status line
setw -g monitor-activity on

# Prevent Tmux from displaying the annoying Activity in window X messages
set -g visual-activity off

# Pass xterm-style keys to make many key combinations work as expected
setw -g xterm-keys on

# Disable the delay between an escape key press and subsequent characters. This increases Vim responsiveness
set -sg escape-time 0

# Increase repeat timeout
set -sg repeat-time 600

# Enable vi-style keys instead of the default emacs-style keys
setw -g mode-keys vi
set -g status-keys vi

# Enable mouse mode
set -g mouse on

# Enable focus events
set -g focus-events on

#================================================================================#
#                                      UI                                        #
#================================================================================#

# Rose Pine, cùng bảng màu với Ghostty (theme) và Neovim (chadrc.lua) để ba lớp trông như một
%hidden base="#191724"
%hidden surface="#1f1d2e"
%hidden overlay="#26233a"
%hidden hl_med="#403d52"
%hidden muted="#6e6a86"
%hidden subtle="#908caa"
%hidden text="#e0def4"
%hidden love="#eb6f92"
%hidden gold="#f6c177"
%hidden foam="#9ccfd8"
%hidden iris="#c4a7e7"

# Hai đầu bo tròn của các "viên" trên thanh trạng thái, và biểu tượng nhánh git / phóng to, cần Nerd Font
# (Ghostty đã dùng MartianMono Nerd Font). Terminal không có font đó thì gán hai biến cap về "" và bỏ , .
%hidden cap_l=""
%hidden cap_r=""

# Màu viên tên phiên báo trạng thái: tím bình thường, hồng khi đang gõ prefix, vàng khi ở chế độ copy
%hidden state="#{?client_prefix,$love,#{?pane_in_mode,$gold,$iris}}"

set -g status on
set -g status-position bottom
set -g status-justify left
set -g status-interval 5
set -g status-style "fg=$subtle,bg=default"

# Trái: viên tên phiên. Phải: nhánh git của pane đang chọn (trống khi không phải repo), ngày, giờ
set -g status-left-length 60
set -g status-left "#[fg=${state},bg=default]${cap_l}#[fg=$base,bg=${state},bold] #S #[fg=${state},bg=default,nobold]${cap_r} "
set -g status-right-length 80
set -g status-right "#[fg=$foam]#(git -C '#{pane_current_path}' branch --show-current 2>/dev/null | sed 's/.*/ &  /')#[fg=$subtle]%a %d/%m  #[fg=$gold]%H:%M "

# Cửa sổ: tab thường mờ, cửa sổ vừa rời hơi sáng hơn, cửa sổ hiện tại là một viên. Hai kiểu cùng rộng
# để chuyển cửa sổ không làm các tab xê dịch.
setw -g window-status-separator ""
setw -g window-status-style "fg=$muted,bg=default"
setw -g window-status-last-style "fg=$subtle,bg=default"
setw -g window-status-activity-style "fg=$gold,bg=default"
setw -g window-status-bell-style "fg=$love,bg=default,bold"
# mặc định của tmux là gạch chân, sẽ gạch cả viên
setw -g window-status-current-style "none"
setw -g window-status-format "  #I #W#{?window_zoomed_flag, ,}  "
setw -g window-status-current-format "#[fg=$overlay,bg=default]${cap_l}#[fg=$iris,bg=$overlay,bold] #I #[fg=$text]#W#{?window_zoomed_flag, ,} #[fg=$overlay,bg=default,nobold]${cap_r}"

# Vùng chọn, dòng lệnh và thông báo
set -g mode-style "fg=$text,bg=$hl_med"
set -g message-style "fg=$text,bg=$overlay"
set -g message-command-style "fg=$gold,bg=$overlay"

# Viền pane: pane đang chọn sáng màu tím
set -g pane-border-style "fg=$hl_med"
set -g pane-active-border-style "fg=$iris"

# Số pane (prefix q), đồng hồ (clock-mode), popup và menu. -q vì tmux cũ chưa có một số tuỳ chọn
# (popup từ 3.3, menu từ 3.4).
set -g display-panes-colour "$muted"
set -g display-panes-active-colour "$love"
setw -g clock-mode-colour "$iris"
set -gq popup-style "fg=$text,bg=$surface"
set -gq popup-border-style "fg=$iris,bg=$surface"
set -gq popup-border-lines rounded
set -gq menu-style "fg=$text,bg=$surface"
set -gq menu-border-style "fg=$iris,bg=$surface"
set -gq menu-border-lines rounded
set -gq menu-selected-style "fg=$base,bg=$iris"

#================================================================================#
#                                 Key bindings                                   #
#================================================================================#

# Reload tmux config
bind r source-file ~/.config/tmux/tmux.conf \; display "Reloaded tmux configuration"

# Copy mode
bind Enter copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel

# Lệnh chép vào clipboard hệ thống; dòng sau thắng dòng trước: xclip < wl-copy < pbcopy
if-shell 'command -v xclip' "set -s copy-command 'xclip -selection clipboard -in'"
if-shell 'command -v wl-copy' "set -s copy-command wl-copy"
if-shell 'command -v pbcopy' "set -s copy-command pbcopy"

# Vertical splits
bind \\ split-window -h -c "#{pane_current_path}"

# Horizontal splits
bind - split-window -v -c "#{pane_current_path}"

# Pane navigation
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"

bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h' { if -F '#{pane_at_left}' '' 'select-pane -L' }
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j' { if -F '#{pane_at_bottom}' '' 'select-pane -D' }
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k' { if -F '#{pane_at_top}' '' 'select-pane -U' }
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l' { if -F '#{pane_at_right}' '' 'select-pane -R' }

bind-key -T copy-mode-vi 'C-h' if -F '#{pane_at_left}' '' 'select-pane -L'
bind-key -T copy-mode-vi 'C-j' if -F '#{pane_at_bottom}' '' 'select-pane -D'
bind-key -T copy-mode-vi 'C-k' if -F '#{pane_at_top}' '' 'select-pane -U'
bind-key -T copy-mode-vi 'C-l' if -F '#{pane_at_right}' '' 'select-pane -R'

# Pane resizing
bind -n 'M-h' if-shell "$is_vim" 'send-keys M-h' 'resize-pane -L 3'
bind -n 'M-j' if-shell "$is_vim" 'send-keys M-j' 'resize-pane -D 3'
bind -n 'M-k' if-shell "$is_vim" 'send-keys M-k' 'resize-pane -U 3'
bind -n 'M-l' if-shell "$is_vim" 'send-keys M-l' 'resize-pane -R 3'

bind-key -T copy-mode-vi M-h resize-pane -L 3
bind-key -T copy-mode-vi M-j resize-pane -D 3
bind-key -T copy-mode-vi M-k resize-pane -U 3
bind-key -T copy-mode-vi M-l resize-pane -R 3

bind -n 'M-,' swap-pane -D
bind -n 'M-.' swap-pane -U

# Windows
bind t new-window -c "#{pane_current_path}"
bind w kill-pane
bind -r h previous-window
bind -r l next-window

# navi
bind-key -T prefix C-g split-window \
  "$SHELL --login -i -c 'navi --print | head -n 1 | tmux load-buffer -b tmp - ; tmux paste-buffer -p -t {last} -b tmp -d'"

#================================================================================#
#                                   Commands                                     #
#================================================================================#

run '~/.config/tmux/plugins/tpm/tpm'

