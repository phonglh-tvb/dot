# Mặc định SSH dùng chung cho mọi máy. KHÔNG chứa host riêng (IP, user, khoá): phần đó ở ~/.ssh/config
# hoặc ~/.ssh/config.d/ của từng máy, không commit.
#
# Dùng: thêm hai dòng sau vào CUỐI ~/.ssh/config. ssh lấy giá trị đầu tiên gặp nên host cụ thể ở trên thắng
# mặc định ở đây; `Match all` đưa Include ra khỏi phạm vi của khối Host nằm ngay trên nó.
#
#   Match all
#   Include ~/.config/ssh/defaults.conf

Host *
  AddKeysToAgent yes
  IgnoreUnknown UseKeychain
  UseKeychain yes
  ServerAliveInterval 30
  ServerAliveCountMax 4
