# Symlink dotfiles bằng scripts/link.sh: một nguồn duy nhất cho cả ./install.sh lẫn Ansible.
# Đồ có sẵn được chuyển vào ~/.dotfiles-backup/, không bị xoá.
- name: Link dotfiles
  command: "{{ dot_repo_root }}/scripts/link.sh apply"
  register: dot_link
  changed_when: "'changed=0' not in dot_link.stdout"
